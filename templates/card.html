<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; style-src 'unsafe-inline'; img-src data:">
<title>Card de nota</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:{{LARGURA}}px;height:{{ALTURA}}px;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f1ea;color:#1d1d1b;display:flex}
.moldura{margin:{{MARGEM}}px;flex:1;border:4px solid #1d1d1b;border-radius:36px;background:#fff;padding:{{PADDING}}px;display:flex;flex-direction:column;justify-content:space-between}
.topo{display:flex;justify-content:space-between;align-items:baseline;font-size:{{FONTE_PEQUENA}}px;color:#5b5a55}
.site{font-size:{{FONTE_SITE}}px;font-weight:800;line-height:1.1;word-break:break-all;margin-top:12px}
.centro{display:flex;align-items:center;gap:{{GAP}}px}
.nota{font-size:{{FONTE_NOTA}}px;font-weight:900;line-height:.9;letter-spacing:-.03em}
.nota small{display:block;font-size:{{FONTE_PEQUENA}}px;font-weight:600;letter-spacing:0;color:#5b5a55;margin-top:10px}
.nivel{font-size:{{FONTE_NIVEL}}px;font-weight:800;color:#1f4fd8}
.numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.n{border:2px solid #e4e1d8;border-radius:20px;padding:16px 18px}
.n b{display:block;font-size:{{FONTE_N}}px;line-height:1}
.n span{font-size:{{FONTE_PEQUENA}}px;color:#5b5a55}
.evolucao{font-size:{{FONTE_NIVEL}}px;font-weight:800;color:#1a7f4b}
.pe{font:{{FONTE_MINI}}px/1.35 ui-monospace,Consolas,monospace;color:#5b5a55;word-break:break-all}
.aviso{font-size:{{FONTE_MINI}}px;color:#5b5a55}
</style>
</head>
<body>
<div class="moldura">
  <div>
    <div class="topo"><span>critiquesites</span><span>{{DATA}}</span></div>
    <div class="site">{{SITE}}</div>
  </div>
  <div class="centro">
    <div class="nota">{{NOTA}}<small>nota geral de 100</small></div>
    <div><div class="nivel">{{NIVEL}}</div>{{EVOLUCAO}}</div>
  </div>
  <div class="numeros">
    <div class="n"><b>{{N1}}</b><span>{{R1}}</span></div>
    <div class="n"><b>{{N2}}</b><span>{{R2}}</span></div>
    <div class="n"><b>{{N3}}</b><span>{{R3}}</span></div>
  </div>
  <div>
    <div class="aviso">A nota é um sinal, não um veredito.</div>
    <div class="pe">versão {{HASH}}</div>
  </div>
</div>
</body>
</html>
