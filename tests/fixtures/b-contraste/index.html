<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contraste</title>
<style>
body{margin:0;background:#ffffff;color:#111111;font-family:Georgia,serif}
.a{color:#aaaaaa;font-size:16px;padding:8px}
.b{color:#777777;font-size:16px;padding:8px}
.c{color:#767676;font-size:16px;padding:8px}
.d{color:#999999;font-size:28px;padding:8px}
.e{color:#cccccc;font-size:16px;padding:8px;background:linear-gradient(#ffffff,#eeeeee)}
.f{background:#003366;padding:8px}.f p{color:#ffffff;margin:0;font-size:16px}
</style></head>
<body>
<p class="a">Cinza claro sobre branco (#aaa), falha</p>
<p class="b">Cinza 777 sobre branco, falha por pouco</p>
<p class="c">Cinza 767676 sobre branco, passa por pouco</p>
<h2 class="d">Texto grande 999 sobre branco</h2>
<p class="e">Texto sobre gradiente, indeterminado</p>
<div class="f"><p>Branco sobre azul escuro, passa</p></div>
</body></html>
