<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transforme seu negócio</title>
<style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
.hero{text-align:center;padding:96px 24px}
.hero h1{font-size:48px;background:linear-gradient(90deg,#6366f1,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:24px}
.card{border-radius:16px;padding:24px;box-shadow:0 10px 15px rgba(0,0,0,.15);background:#1e293b}
.card .card{border-radius:16px;padding:24px;background:#334155}
.btn{border-radius:16px;padding:12px 24px;background:#6366f1;color:#fff;border:0}
.fade{animation:entrar .6s both}@keyframes entrar{from{opacity:0}to{opacity:1}}
</style></head>
<body><section class="hero"><h1>Transforme seu negócio com a próxima geração de soluções</h1>
<p>Libere todo o potencial da sua marca de forma simples e sem esforço.</p><button class="btn">Comece agora</button></section>
<section class="grid">
<div class="card fade"><h3>🚀 Rápido</h3><p>Resultados incríveis em minutos.</p></div>
<div class="card fade"><h3>✨ Inteligente</h3><p>Tecnologia de ponta para você.</p></div>
<div class="card fade"><h3>🔒 Seguro</h3><p>Sua tranquilidade em primeiro lugar.</p><div class="card"><p>Saiba mais</p></div></div>
</section></body></html>
